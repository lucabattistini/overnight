name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: Shell checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax
        run: sh -n payload/*.sh scripts/*.sh tests/payload/run.sh

      - name: Lint
        run: shellcheck payload/*.sh scripts/*.sh scripts/check-managed-keys.sh tests/payload/run.sh

      - name: Managed-key drift
        run: sh scripts/check-managed-keys.sh

      # The installer window's geometry is shared between a shell script and a Python script.
      # Nothing at runtime makes them agree, and the symptom of them not agreeing is an arrow
      # pointing at empty space in a DMG that has already shipped.
      - name: Installer window layout drift
        run: sh scripts/check-dmg-layout.sh

      - name: Payload harness
        run: sh tests/payload/run.sh

      - name: Icon script syntax
        run: python3 -m py_compile scripts/icons.py

      # The app icon, the volume icon and the installer background are all committed rather
      # than built during packaging, so this is what stops them drifting from the branding
      # master. It compares decoded pixels, not compressed bytes, because zlib's output is
      # allowed to differ between versions.
      - name: Branding assets match the branding master
        run: python3 scripts/icons.py verify

  macos:
    name: Build and test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift test

      - name: Build the app bundle
        run: sh scripts/build-app.sh

      - name: The bundle must carry the privileged payload
        run: |
          test -f dist/Overnight.app/Contents/Resources/overnight-enable.sh
          test -f dist/Overnight.app/Contents/Resources/overnight-restore.sh

      - name: The bundle must carry the icon Info.plist names
        run: |
          icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' \
            dist/Overnight.app/Contents/Info.plist)
          test -f "dist/Overnight.app/Contents/Resources/${icon}.icns"
          # A .icns macOS refuses to read would still pass a file test, and the icns here is
          # written by a Python script rather than by iconutil. Ask iconutil to take it apart
          # again: that is the same reader the system uses.
          iconutil --convert iconset \
            --output "$RUNNER_TEMP/Overnight.iconset" \
            "dist/Overnight.app/Contents/Resources/${icon}.icns"
          for name in 16x16 16x16@2x 32x32 32x32@2x 128x128 128x128@2x \
                      256x256 256x256@2x 512x512 512x512@2x; do
            test -f "$RUNNER_TEMP/Overnight.iconset/icon_${name}.png" \
              || { echo "icns is missing icon_${name}.png" >&2; exit 1; }
          done

      - name: The binary must be universal
        run: |
          file dist/Overnight.app/Contents/MacOS/Overnight | tee /dev/stderr | grep -q arm64
          file dist/Overnight.app/Contents/MacOS/Overnight | tee /dev/stderr | grep -q x86_64

      - name: Package the DMG
        run: sh scripts/make-dmg.sh

      # A DMG that builds is not a DMG that installs well. None of this can run off macOS, and
      # none of it proves the window *looks* right — docs/MANUAL-CHECKS.md M9 is where a pair
      # of eyes comes in — but it does prove Finder was actually asked and actually answered.
      - name: The DMG must carry the installer window
        run: |
          set -eu
          VOLUME="$RUNNER_TEMP/OvernightDMG"
          mkdir -p "$VOLUME"
          hdiutil attach dist/Overnight.dmg \
            -readonly -noverify -noautoopen -mountpoint "$VOLUME" >/dev/null
          trap 'hdiutil detach "$VOLUME" -force >/dev/null 2>&1 || true' EXIT

          test -d "$VOLUME/Overnight.app"
          test -L "$VOLUME/Applications"
          test -f "$VOLUME/.VolumeIcon.icns"
          ls "$VOLUME/.background" | grep -qE '^background\.(tiff|png)$'

          # The volume icon is written by the same Python that writes the app icon, so put it
          # through the same reader macOS uses rather than trusting the file test above.
          iconutil --convert iconset \
            --output "$RUNNER_TEMP/VolumeIcon.iconset" "$VOLUME/.VolumeIcon.icns"
          test -f "$RUNNER_TEMP/VolumeIcon.iconset/icon_512x512@2x.png"

          # .VolumeIcon.icns is inert unless the volume root carries kHasCustomIcon.
          flags=$(xattr -px com.apple.FinderInfo "$VOLUME" | tr -d ' \n' | cut -c17-20)
          test "$flags" = "0400" || { echo "Finder flags are $flags, expected 0400" >&2; exit 1; }

          # If the AppleScript had silently done nothing, everything above would still pass.
          # These two four-character record types are what Finder writes into .DS_Store for
          # icon view options and for a hand-placed icon.
          test -f "$VOLUME/.DS_Store"
          LC_ALL=C grep -q icvp "$VOLUME/.DS_Store" \
            || { echo ".DS_Store has no icon view options; the layout did not stick" >&2; exit 1; }
          LC_ALL=C grep -q Iloc "$VOLUME/.DS_Store" \
            || { echo ".DS_Store has no icon positions; the layout did not stick" >&2; exit 1; }

      - name: Payload harness on macOS
        run: sh tests/payload/run.sh
